name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Install UI dependencies
        run: cd ui && pnpm install

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('ui/pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: cd ui && pnpm exec playwright install chromium --with-deps

      - name: Run tests
        run: make test

      - name: Build UI
        run: cd ui && pnpm build

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run govulncheck (backend)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # GO-2026-4887, GO-2026-4883: docker/docker AuthZ plugin vulns, Fixed in: N/A
          # Tracked in https://github.com/imdsutil/barnacle-imds-proxy/issues/44
          # Dependabot (gomod/backend) will open a PR when Docker ships a fix - remove these then
          output=$(govulncheck -C backend ./... 2>&1) || true
          echo "$output"
          unsuppressed=$(echo "$output" | grep -oE "GO-[0-9]+-[0-9]+" | sort -u | grep -vE "^(GO-2026-4887|GO-2026-4883)$") || true
          if [ -n "$unsuppressed" ]; then
            echo "Unsuppressed vulnerabilities: $unsuppressed"
            exit 1
          fi

      - name: Run govulncheck (proxy)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          output=$(govulncheck -C proxy ./... 2>&1) || true
          echo "$output"
          unsuppressed=$(echo "$output" | grep -oE "GO-[0-9]+-[0-9]+" | sort -u | grep -vE "^(GO-2026-4887|GO-2026-4883)$") || true
          if [ -n "$unsuppressed" ]; then
            echo "Unsuppressed vulnerabilities: $unsuppressed"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Install UI dependencies
        run: cd ui && pnpm install

      - name: Run pnpm audit
        run: cd ui && pnpm audit

  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6
